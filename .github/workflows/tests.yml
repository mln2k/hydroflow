name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hydroflow
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydroflow_test
          POSTGRES_USER: hydroflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hydroflow -d hydroflow_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://hydroflow:ci-only-password@localhost:5432/hydroflow_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox
      - run: node --check static/app.js && node --check static/pages.js
      - run: |
          python -m hydroflow init
          python -m hydroflow serve > server.log 2>&1 &
          python -c "import urllib.request,time; exec('for _ in range(30):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\"); break\n except OSError: time.sleep(1)\nelse: raise SystemExit(\"Server unavailable\")')"
          node tests/browser_smoke.cjs
          node tests/browser_audit.cjs
          node tests/browser_pages.cjs
          HF_BROWSER=firefox node tests/browser_pages.cjs
        env:
          HYDROFLOW_ADMIN_PASSWORD: CI-only-password-2468
          HF_TEST_PASSWORD: CI-only-password-2468
  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: CIOnlyDatabasePassword2468
      HYDROFLOW_ADMIN_PASSWORD: CI-only-password-2468
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Default image supports SQLite as non-root
        run: docker compose run --rm --no-deps -e DATABASE_URL=sqlite:///data/docker-test.db -e HYDROFLOW_ADMIN_PASSWORD app python -m hydroflow init
      - run: docker compose up -d --wait db
      - run: docker compose run --rm -e HYDROFLOW_ADMIN_PASSWORD app python -m hydroflow init
      - run: docker compose run --rm -e HYDROFLOW_ADMIN_PASSWORD app python -m hydroflow init
      - run: docker compose up -d --wait app
      - run: curl --fail http://127.0.0.1:8000/api/health
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Remove disposable CI installation
        if: always()
        run: docker compose down --volumes

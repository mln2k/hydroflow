name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydroflow_test
          POSTGRES_USER: hydroflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hydroflow -d hydroflow_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://hydroflow:ci-only-password@localhost:5432/hydroflow_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m hydroflow init
          python -m hydroflow serve > server.log 2>&1 &
          python -c "import urllib.request,time; exec('for _ in range(30):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\"); break\n except OSError: time.sleep(1)\nelse: raise SystemExit(\"Server unavailable\")')"
          node tests/browser_smoke.cjs
        env:
          HYDROFLOW_ADMIN_PASSWORD: CI-only-password-2468
          HF_TEST_PASSWORD: CI-only-password-2468
